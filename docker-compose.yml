# M5 Forecasting Model Laboratory -- local infrastructure.
#
# One service. The previous compose file provisioned eight (PostgreSQL, Redis,
# Airflow webserver + scheduler, FastAPI, Streamlit, Prometheus, Grafana) for
# components this project no longer has.
#
# What was removed and why:
#   * FastAPI / Streamlit -- the serving and dashboard layers are gone; this is
#     a research lab whose deliverables are notebooks, figures and analysis.
#   * Prometheus / Grafana -- runtime service monitoring, and there is no
#     runtime service to monitor.
#   * Airflow (webserver, scheduler, metadata DB) -- DVC already provides
#     pipeline reproducibility. For a project with no production schedule,
#     Airflow adds a scheduler and a metadata database for no benefit `dvc
#     repro` does not already deliver.
#   * PostgreSQL -- replaced by DuckDB, which needs no server at all. DuckDB is
#     an in-process library, so it is a dependency rather than a service and
#     correctly has no entry here.
#   * Redis -- was a cache for the deleted API.
#
# MLflow remains because experiment tracking across ~40 models genuinely needs
# a shared store, and the Model Registry (used by the promotion gate) requires
# a database backend rather than a file store.
#
# Usage:
#   docker compose up -d mlflow      # UI at http://localhost:5000
#
# Not required: every script falls back to a local SQLite tracking store when
# this is not running, so the pipeline works without Docker at all.

services:

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    container_name: m5_mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # SQLite rather than a file store: MLflow 3.x put the filesystem backend
      # into maintenance mode and raises on it, and only a database backend
      # supports the Model Registry the promotion gate depends on.
      MLFLOW_BACKEND_STORE_URI: sqlite:////mlflow/mlflow.db
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  mlflow_data:
    driver: local
