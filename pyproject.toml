[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "m5-forecasting-lab"
version = "3.0.0"
description = "Comparative study of statistical, probabilistic, ML and deep learning forecasting models on the M5 retail dataset"
# Pinned to 3.11: several forecasting dependencies lack wheels on 3.12+.
requires-python = ">=3.11,<3.12"
readme = "README.md"
license = { text = "MIT" }

# ---------------------------------------------------------------------------
# Runtime dependencies
#
# Removed in v3, and why:
#   * fastapi / uvicorn / slowapi / streamlit / plotly -- the serving and
#     dashboard layers were deleted. This is a research lab: the deliverables
#     are notebooks, pipelines, tracked experiments and figures.
#   * sqlalchemy / psycopg2 / asyncpg -- PostgreSQL replaced by DuckDB, which
#     is a single file with no server and is far faster for the analytical
#     scans this project performs.
#   * pymoo / deap / networkx / econml -- belonged to the non-ML modules
#     (NSGA-II, supply-chain graph, elasticity) that are out of scope.
#
# Added in v3:
#   * torch / neuralforecast -- the M5-era finding that gradient boosting beat
#     deep learning is now a HYPOTHESIS TO TEST, not an assumption. N-HiTS,
#     PatchTST, DLinear and TiDE all postdate the competition.
#   * statsforecast -- vectorised classical models; the only practical way to
#     fit AutoETS/AutoARIMA across 30,490 series.
#   * mapie / ngboost -- conformal prediction and probabilistic boosting for
#     Tier 3.
# ---------------------------------------------------------------------------
dependencies = [
    # Data engineering
    "pandas>=2.1.0",
    "polars>=0.20.0",
    "numpy>=1.26.0,<2.2",
    "pyarrow>=14.0.0",
    "openpyxl>=3.1.0",          # the M5 dataset ships as a single .xlsx
    # Declared for the analytical query layer (ADR-002). Parquet + Polars
    # currently cover every read; DuckDB is wired in when the feature store
    # needs cross-panel SQL.
    "duckdb>=0.10.0",
    "dvc>=3.30.0",

    # Validation
    "pandera>=0.18.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Tier 1 -- statistical forecasting
    "statsforecast>=2.0.3",
    "numba>=0.60.0",
    "statsmodels>=0.14.0",
    "prophet>=1.1.0",

    # Tier 2 -- classical machine learning
    "scikit-learn>=1.3.2",
    "lightgbm>=4.2.0",
    "xgboost>=2.0.0",
    "catboost>=1.2.2",
    "scipy>=1.11.0",
    "optuna>=3.4.0",

    # Tier 3 -- probabilistic (phase D, not yet imported)
    "mapie>=0.8.0",
    "ngboost>=0.4.0",

    # Tier 4 -- deep learning (phase E, not yet imported)
    "torch>=2.2.0",
    "neuralforecast>=1.7.0",

    # MLOps
    "mlflow>=2.9.0",

    # Pillar 5 -- results analysis & dashboard
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "shap>=0.44.0",
    "plotly>=5.18.0",
    "streamlit>=1.30.0",

    # Utilities
    "loguru>=0.7.2",
    "structlog>=23.2.0",
    "pyyaml>=6.0.1",
    "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "hypothesis>=6.92.0",
    "black>=23.12.0",
    "ruff>=0.1.8",
    "mypy>=1.7.0",
    "jupyter>=1.0.0",
    "nbformat>=5.9.0",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "PT"]
ignore = [
    "E501",   # line length -- black owns formatting
    "E741",   # `l` as a loop variable reads fine in the lag comprehensions
    # N803/N806 flag `X`, `X_tr`, `X_te` as badly named. In numerical code the
    # capital-X-for-design-matrix convention is near-universal (it is what
    # scikit-learn's own API uses), and renaming to `x` would make the code
    # LESS readable to the audience for it.
    "N803",   # argument name should be lowercase
    "N806",   # variable in function should be lowercase
    "B905",   # zip(strict=) -- the zipped sequences are constructed together
]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "unit: Unit tests -- no external data or services required",
    "integration: Requires the extracted M5 Parquet files",
    "slow: Long-running (training / backtest) tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff.lint.per-file-ignores]
# scripts/ and the backtest engine insert the repo root on sys.path before
# importing `src`, so their imports cannot be at the top of the file.
"scripts/**/*.py" = ["E402"]
"src/evaluation/backtest.py" = ["E402"]
# Pandera's `@pa.check` validators receive the DataFrame as `cls`-style first
# arg by design, and the trainer/reconciler defer heavy optional imports to the
# point of use so the modules import without the full stack installed.
"src/data/validator.py" = ["N805"]
"src/models/classical_ml/trainer.py" = ["E402", "C408", "C416"]
"src/models/hierarchical/reconciler.py" = ["E402"]
