[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "supply-chain-platform"
version = "1.0.0"
description = "Intelligent Supply Chain Decision Intelligence Platform"
authors = [
    {name = "Supply Chain Platform Team", email = "team@scplatform.io"}
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    # Data Engineering
    "pandas>=2.1.0",
    "polars>=0.20.0",
    "numpy>=1.26.0",
    "pyarrow>=14.0.0",
    "dvc>=3.30.0",
    "dvc-s3>=3.0.0",

    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",

    # Data Validation
    "great-expectations>=0.18.0",
    "pandera>=0.18.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Machine Learning
    "scikit-learn>=1.3.2",
    "xgboost>=2.0.0",
    "lightgbm>=4.2.0",
    "catboost>=1.2.2",
    "statsmodels>=0.14.0",
    "scipy>=1.11.0",

    # Probabilistic & Causal ML
    "econml>=0.15.0",
    "dowhy>=0.11.0",
    "shap>=0.44.0",
    "optuna>=3.4.0",

    # Optimization
    "pulp>=2.7.0",
    "deap>=1.4.1",
    "pymoo>=0.6.1",

    # Graph Analytics
    "networkx>=3.2.0",
    "matplotlib>=3.8.0",

    # MLOps
    "mlflow>=2.9.0",
    "evidently>=0.4.0",

    # API
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.25.0",
    "python-multipart>=0.0.6",
    "slowapi>=0.1.9",

    # Dashboard
    "streamlit>=1.29.0",
    "plotly>=5.18.0",
    "altair>=5.2.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
    "tenacity>=8.2.3",
    "prometheus-client>=0.19.0",
    "structlog>=23.2.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "pyyaml>=6.0.1",
    "toml>=0.10.2",
    "holidays>=0.40",
    "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "hypothesis>=6.92.0",
    "black>=23.12.0",
    "ruff>=0.1.8",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
    "factory-boy>=3.3.0",
]

airflow = [
    "apache-airflow>=2.8.0",
    "apache-airflow-providers-postgres>=5.10.0",
    "apache-airflow-providers-docker>=3.8.0",
    "apache-airflow-providers-http>=4.7.0",
    "apache-airflow-providers-slack>=8.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "C4", "PT"]
ignore = ["ANN101", "ANN102", "E501"]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=html --cov-report=term-missing"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
